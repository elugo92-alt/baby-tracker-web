<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta
        name="theme-color"
        content="#ffffff">

    <title>Baby Tracker</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-512.png">

    <meta
        name="apple-mobile-web-app-capable"
        content="yes">

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default">

    <meta
        name="apple-mobile-web-app-title"
        content="Baby Tracker">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #f6f6f6;
            color: #111;
        }

        .app {
            max-width: 600px;
            margin: 0 auto;

            padding-top:
                max(20px, env(safe-area-inset-top));

            padding-right:
                max(20px, env(safe-area-inset-right));

            padding-bottom:
                max(20px, env(safe-area-inset-bottom));

            padding-left:
                max(20px, env(safe-area-inset-left));
        }

        h1 {
            margin-top: 10px;
            margin-bottom: 5px;
            font-size: 34px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 16px;
        }

        input,
        select,
        button {
            width: 100%;
            min-height: 50px;
            font-size: 17px;
            border-radius: 10px;
            font-family: inherit;
        }

        input,
        select {
            border: 1px solid #ccc;
            padding: 10px 12px;
            margin-bottom: 10px;
            background: white;
        }

        button {
            border: 0;
            padding: 10px;
            margin-bottom: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        .primary {
            background: #111;
            color: white;
        }

        .secondary {
            background: #e8e8e8;
            color: #111;
        }

        .danger {
            background: #f4dddd;
            color: #7a0000;
        }

        .hidden {
            display: none;
        }

        .counts {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .count {
            text-align: center;
            background: white;
            border-radius: 14px;
            padding: 15px 5px;
        }

        .count .emoji {
            font-size: 24px;
        }

        .count .number {
            font-size: 26px;
            font-weight: 700;
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 16px;
        }

        .actions button {
            min-height: 68px;
        }

        .history-title {
            font-size: 24px;
            font-weight: 700;
            margin: 24px 0 12px;
        }

        .event {
            background: white;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
        }

        .event-name {
            font-size: 19px;
            font-weight: 700;
        }

        .event-time {
            color: #666;
            font-size: 14px;
            margin-top: 4px;
        }

        .event-buttons {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .event-buttons button {
            width: 50%;
            min-height: 42px;
            margin: 0;
        }

        .status {
            font-size: 14px;
            color: #666;
            margin-top: 8px;
        }

        .feed-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 8px;
        }

        .field-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #555;
            margin: 4px 0 6px;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal.hidden {
            display: none;
        }

        .modal-card {
            background: white;
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            padding: 18px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-card h2 {
            margin-top: 0;
        }

    </style>
</head>

<body>

<div class="app">

    <h1>Baby Tracker</h1>

    <div class="subtitle">
        Shared baby log
    </div>

    <div id="loginCard" class="card">

        <h2>Sign In</h2>

        <input
            id="email"
            type="email"
            placeholder="Email"
            autocomplete="email">

        <input
            id="password"
            type="password"
            placeholder="Password"
            autocomplete="current-password">

        <button
            id="signInButton"
            class="primary">
            Sign In
        </button>

        <div
            id="loginStatus"
            class="status">
        </div>

    </div>


    <div
        id="tracker"
        class="hidden">

        <div class="counts">

            <div class="count">

                <div class="emoji">
                    💧
                </div>

                <div
                    id="peeCount"
                    class="number">
                    0
                </div>

                <div>
                    Pee
                </div>

            </div>


            <div class="count">

                <div class="emoji">
                    💩
                </div>

                <div
                    id="poopCount"
                    class="number">
                    0
                </div>

                <div>
                    Poop
                </div>

            </div>


            <div class="count">

                <div class="emoji">
                    🍼
                </div>

                <div
                    id="feedCount"
                    class="number">
                    0
                </div>

                <div>
                    Feed
                </div>

            </div>

        </div>


        <div class="actions">

            <button
                id="peeButton"
                class="secondary">
                💧 Pee
            </button>

            <button
                id="poopButton"
                class="secondary">
                💩 Poop
            </button>

            <button
                id="feedButton"
                class="secondary">
                🍼 Feed
            </button>

        </div>


        <div class="card">

            <div id="todayFeedTotal">
                Today feed total: 0 mL
            </div>

            <div
                id="cloudStatus"
                class="status">
                Connected
            </div>

            <button
                id="signOutButton"
                class="secondary"
                style="margin-top:14px">
                Sign Out
            </button>

        </div>


        <div class="history-title">
            History
        </div>

        <div id="history"></div>

    </div>

</div>


<!-- FEED MODAL -->

<div
    id="feedModal"
    class="modal hidden">

    <div class="modal-card">

        <h2 id="feedModalTitle">
            Log Feeding
        </h2>

        <div class="feed-row">

            <input
                id="feedAmount"
                type="number"
                step="0.1"
                inputmode="decimal"
                placeholder="Amount">

            <select id="feedUnit">

                <option value="oz">
                    oz
                </option>

                <option value="ml">
                    mL
                </option>

            </select>

        </div>


        <label
            class="field-label"
            for="feedDateTime">
            Date and time
        </label>

        <input
            id="feedDateTime"
            type="datetime-local">


        <button
            id="saveFeedButton"
            class="primary">
            Save Feed
        </button>

        <button
            id="cancelFeedButton"
            class="secondary">
            Cancel
        </button>

    </div>

</div>


<!-- PEE / POOP EDIT MODAL -->

<div
    id="editSimpleModal"
    class="modal hidden">

    <div class="modal-card">

        <h2 id="editSimpleTitle">
            Edit
        </h2>


        <label
            class="field-label"
            for="simpleDateTime">
            Date and time
        </label>

        <input
            id="simpleDateTime"
            type="datetime-local">


        <button
            id="saveSimpleButton"
            class="primary">
            Save Changes
        </button>

        <button
            id="cancelSimpleButton"
            class="secondary">
            Cancel
        </button>

    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
    getDatabase,
    ref,
    set,
    update,
    onValue
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyC2Bx2QOJMk8Q28LSJmBDGjyLZHztDWA20",

    authDomain:
        "lugo-baby-tracker.firebaseapp.com",

    databaseURL:
        "https://lugo-baby-tracker-default-rtdb.firebaseio.com",

    projectId:
        "lugo-baby-tracker",

    storageBucket:
        "lugo-baby-tracker.firebasestorage.app",

    messagingSenderId:
        "440667557935",

    appId:
        "1:440667557935:web:d5e096f71fa5f200d576da"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getDatabase(app);


const loginCard =
    document.getElementById("loginCard");

const tracker =
    document.getElementById("tracker");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginStatus =
    document.getElementById("loginStatus");

const cloudStatus =
    document.getElementById("cloudStatus");

const history =
    document.getElementById("history");


const feedModal =
    document.getElementById("feedModal");

const feedAmount =
    document.getElementById("feedAmount");

const feedUnit =
    document.getElementById("feedUnit");

const feedDateTime =
    document.getElementById("feedDateTime");

const feedModalTitle =
    document.getElementById("feedModalTitle");


const editSimpleModal =
    document.getElementById("editSimpleModal");

const editSimpleTitle =
    document.getElementById("editSimpleTitle");

const simpleDateTime =
    document.getElementById("simpleDateTime");


let currentUid = null;

let currentEvents = {};

let unsubscribeEvents = null;

let editingFeedId = null;

let editingSimpleId = null;



/* SIGN IN */

document
    .getElementById("signInButton")
    .addEventListener(
        "click",
        async () => {

            loginStatus.textContent =
                "Signing in...";

            try {

                await signInWithEmailAndPassword(
                    auth,
                    emailInput.value.trim(),
                    passwordInput.value
                );

                passwordInput.value = "";

            } catch (error) {

                loginStatus.textContent =
                    error.message;

            }
        }
    );



/* SIGN OUT */

document
    .getElementById("signOutButton")
    .addEventListener(
        "click",
        async () => {

            await signOut(auth);

        }
    );



/* AUTH STATE */

onAuthStateChanged(
    auth,
    user => {

        if (unsubscribeEvents) {

            unsubscribeEvents();

            unsubscribeEvents = null;

        }

        if (!user) {

            currentUid = null;

            currentEvents = {};

            loginCard.classList.remove(
                "hidden"
            );

            tracker.classList.add(
                "hidden"
            );

            loginStatus.textContent = "";

            return;

        }

        currentUid = user.uid;

        loginCard.classList.add(
            "hidden"
        );

        tracker.classList.remove(
            "hidden"
        );

        cloudStatus.textContent =
            "Connected as " +
            user.email;

        watchEvents();

    }
);



function eventsRef() {

    return ref(
        db,
        "users/" +
        currentUid +
        "/events"
    );

}



function watchEvents() {

    unsubscribeEvents =
        onValue(
            eventsRef(),
            snapshot => {

                currentEvents =
                    snapshot.val() || {};

                render();

            }
        );

}



function makeCloudId() {

    if (
        typeof crypto !== "undefined" &&
        crypto.randomUUID
    ) {

        return (
            "web_" +
            crypto
                .randomUUID()
                .replaceAll("-", "")
        );

    }

    return (
        "web_" +
        Date.now() +
        "_" +
        Math.floor(
            Math.random() * 1000000
        )
    );

}



/* DATE HELPERS */

function dateToInputValue(timestamp) {

    const date =
        new Date(timestamp);

    const offset =
        date.getTimezoneOffset() *
        60000;

    return new Date(
        timestamp - offset
    )
        .toISOString()
        .slice(0, 16);

}


function inputValueToTimestamp(value) {

    if (!value) {
        return NaN;
    }

    return new Date(value).getTime();

}



/* PEE AND POOP */

async function addSimple(type) {

    if (!currentUid) {
        return;
    }

    const cloudId =
        makeCloudId();

    const now =
        Date.now();

    await set(

        ref(
            db,
            "users/" +
            currentUid +
            "/events/" +
            cloudId
        ),

        {
            cloudId: cloudId,
            type: type,
            timestamp: now,
            source: "web",
            deleted: false,
            updatedAt: now
        }

    );

}


document
    .getElementById("peeButton")
    .addEventListener(
        "click",
        () => addSimple("pee")
    );


document
    .getElementById("poopButton")
    .addEventListener(
        "click",
        () => addSimple("poop")
    );



/* OPEN NEW FEED */

document
    .getElementById("feedButton")
    .addEventListener(
        "click",
        () => {

            editingFeedId = null;

            feedModalTitle.textContent =
                "Log Feeding";

            feedAmount.value = "";

            feedUnit.value = "oz";

            feedDateTime.value =
                dateToInputValue(
                    Date.now()
                );

            feedModal.classList.remove(
                "hidden"
            );

        }
    );



/* CANCEL FEED */

document
    .getElementById("cancelFeedButton")
    .addEventListener(
        "click",
        () => {

            feedModal.classList.add(
                "hidden"
            );

            editingFeedId = null;

        }
    );



/* SAVE FEED */

document
    .getElementById("saveFeedButton")
    .addEventListener(
        "click",
        async () => {

            const amount =
                Number(
                    feedAmount.value
                );

            const unit =
                feedUnit.value;

            const timestamp =
                inputValueToTimestamp(
                    feedDateTime.value
                );


            if (
                !Number.isFinite(amount) ||
                amount <= 0
            ) {

                alert(
                    "Enter a feeding amount greater than 0."
                );

                return;

            }


            if (
                !Number.isFinite(timestamp)
            ) {

                alert(
                    "Choose a valid date and time."
                );

                return;

            }


            const amountMl =
                unit === "oz"
                    ? amount * 29.5735
                    : amount;


            const updatedAt =
                Date.now();


            if (editingFeedId) {

                await update(

                    ref(
                        db,
                        "users/" +
                        currentUid +
                        "/events/" +
                        editingFeedId
                    ),

                    {
                        enteredAmount:
                            amount,

                        enteredUnit:
                            unit,

                        amountMl:
                            amountMl,

                        timestamp:
                            timestamp,

                        deleted:
                            false,

                        updatedAt:
                            updatedAt
                    }

                );

            } else {

                const cloudId =
                    makeCloudId();


                await set(

                    ref(
                        db,
                        "users/" +
                        currentUid +
                        "/events/" +
                        cloudId
                    ),

                    {
                        cloudId:
                            cloudId,

                        type:
                            "feed",

                        enteredAmount:
                            amount,

                        enteredUnit:
                            unit,

                        amountMl:
                            amountMl,

                        timestamp:
                            timestamp,

                        source:
                            "web",

                        deleted:
                            false,

                        updatedAt:
                            updatedAt
                    }

                );

            }


            editingFeedId = null;

            feedModal.classList.add(
                "hidden"
            );

        }
    );



/* EDIT FEED */

function openFeedEdit(cloudId) {

    const event =
        currentEvents[cloudId];

    if (!event) {
        return;
    }


    editingFeedId =
        cloudId;


    feedModalTitle.textContent =
        "Edit Feeding";


    feedAmount.value =
        event.enteredAmount ?? "";


    feedUnit.value =
        event.enteredUnit || "oz";


    feedDateTime.value =
        dateToInputValue(
            event.timestamp
        );


    feedModal.classList.remove(
        "hidden"
    );

}



/* EDIT PEE OR POOP */

function openSimpleEdit(cloudId) {

    const event =
        currentEvents[cloudId];

    if (!event) {
        return;
    }


    editingSimpleId =
        cloudId;


    const typeName =
        event.type === "pee"
            ? "Pee"
            : "Poop";


    editSimpleTitle.textContent =
        "Edit " +
        typeName;


    simpleDateTime.value =
        dateToInputValue(
            event.timestamp
        );


    editSimpleModal.classList.remove(
        "hidden"
    );

}



/* CANCEL SIMPLE EDIT */

document
    .getElementById("cancelSimpleButton")
    .addEventListener(
        "click",
        () => {

            editingSimpleId = null;

            editSimpleModal.classList.add(
                "hidden"
            );

        }
    );



/* SAVE SIMPLE EDIT */

document
    .getElementById("saveSimpleButton")
    .addEventListener(
        "click",
        async () => {

            if (!editingSimpleId) {
                return;
            }


            const timestamp =
                inputValueToTimestamp(
                    simpleDateTime.value
                );


            if (
                !Number.isFinite(timestamp)
            ) {

                alert(
                    "Choose a valid date and time."
                );

                return;

            }


            await update(

                ref(
                    db,
                    "users/" +
                    currentUid +
                    "/events/" +
                    editingSimpleId
                ),

                {
                    timestamp:
                        timestamp,

                    updatedAt:
                        Date.now()
                }

            );


            editingSimpleId = null;

            editSimpleModal.classList.add(
                "hidden"
            );

        }
    );



/* DELETE EVENT */

async function deleteEvent(cloudId) {

    const event =
        currentEvents[cloudId];

    if (!event) {
        return;
    }


    const description =
        event.type === "feed"
            ? "this feeding"
            : "this " +
              event.type +
              " entry";


    if (
        !confirm(
            "Delete " +
            description +
            "?"
        )
    ) {

        return;

    }


    await update(

        ref(
            db,
            "users/" +
            currentUid +
            "/events/" +
            cloudId
        ),

        {
            deleted:
                true,

            updatedAt:
                Date.now()
        }

    );

}



/* TODAY CHECK */

function isToday(timestamp) {

    const d =
        new Date(timestamp);

    const today =
        new Date();


    return (

        d.getFullYear() ===
        today.getFullYear()

        &&

        d.getMonth() ===
        today.getMonth()

        &&

        d.getDate() ===
        today.getDate()

    );

}



/* RENDER APP */

function render() {

    const entries =
        Object.entries(
            currentEvents
        )

        .filter(
            ([id, event]) =>
                event &&
                !event.deleted
        )

        .sort(
            (a, b) =>
                Number(
                    b[1].timestamp || 0
                ) -
                Number(
                    a[1].timestamp || 0
                )
        );


    let peeCount = 0;

    let poopCount = 0;

    let feedCount = 0;

    let totalMl = 0;


    for (
        const [id, event]
        of entries
    ) {

        if (
            !isToday(
                event.timestamp
            )
        ) {

            continue;

        }


        if (
            event.type === "pee"
        ) {

            peeCount++;

        }


        if (
            event.type === "poop"
        ) {

            poopCount++;

        }


        if (
            event.type === "feed"
        ) {

            feedCount++;

            totalMl +=
                Number(
                    event.amountMl || 0
                );

        }

    }


    document
        .getElementById(
            "peeCount"
        )
        .textContent =
        peeCount;


    document
        .getElementById(
            "poopCount"
        )
        .textContent =
        poopCount;


    document
        .getElementById(
            "feedCount"
        )
        .textContent =
        feedCount;


    document
        .getElementById(
            "todayFeedTotal"
        )
        .textContent =

        "Today feed total: " +

        totalMl.toFixed(0) +

        " mL / " +

        (
            totalMl /
            29.5735
        ).toFixed(2) +

        " oz";


    history.innerHTML = "";


    if (
        entries.length === 0
    ) {

        const empty =
            document.createElement(
                "div"
            );

        empty.className =
            "card";

        empty.textContent =
            "No entries yet.";

        history.appendChild(
            empty
        );

        return;

    }


    for (
        const [cloudId, event]
        of entries
    ) {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "event";


        let name;


        if (
            event.type === "pee"
        ) {

            name =
                "💧 Pee";

        } else if (
            event.type === "poop"
        ) {

            name =
                "💩 Poop";

        } else {

            name =
                "🍼 Feed";

        }


        if (
            event.type === "feed" &&
            event.enteredAmount != null
        ) {

            const displayAmount =
                Number(
                    event.enteredAmount
                );


            name +=
                " • " +

                displayAmount.toFixed(
                    displayAmount % 1 === 0
                        ? 0
                        : 1
                ) +

                " " +

                (
                    event.enteredUnit ||
                    "mL"
                );

        }


        const title =
            document.createElement(
                "div"
            );


        title.className =
            "event-name";


        title.textContent =
            name;


        const time =
            document.createElement(
                "div"
            );


        time.className =
            "event-time";


        time.textContent =
            new Date(
                event.timestamp
            ).toLocaleString();


        card.appendChild(
            title
        );


        card.appendChild(
            time
        );


        const buttons =
            document.createElement(
                "div"
            );


        buttons.className =
            "event-buttons";


        const edit =
            document.createElement(
                "button"
            );


        edit.className =
            "secondary";


        edit.textContent =
            "Edit";


        edit.addEventListener(
            "click",
            () => {

                if (
                    event.type === "feed"
                ) {

                    openFeedEdit(
                        cloudId
                    );

                } else {

                    openSimpleEdit(
                        cloudId
                    );

                }

            }
        );


        const remove =
            document.createElement(
                "button"
            );


        remove.className =
            "danger";


        remove.textContent =
            "Delete";


        remove.addEventListener(
            "click",
            () =>
                deleteEvent(
                    cloudId
                )
        );


        buttons.appendChild(
            edit
        );


        buttons.appendChild(
            remove
        );


        card.appendChild(
            buttons
        );


        history.appendChild(
            card
        );

    }

}

</script>

</body>

</html>
