<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#f8f4ef">

<title>Baby Tracker</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Baby Tracker">

<style>

:root {
    --bg: #f8f4ef;
    --card: rgba(255,255,255,.84);
    --text: #171717;
    --muted: #756f69;

    --blue: #e7f0f6;
    --tan: #f3e7db;
    --green: #e9efe4;
    --lavender: #eeeaf4;
    --pink: #f6e9e3;

    --soft: #efebe6;
    --danger: #9b3a2e;

    --shadow:
        0 12px 30px
        rgba(74,56,42,.08);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    background:
        radial-gradient(
            circle at top right,
            rgba(241,220,184,.35),
            transparent 280px
        ),
        var(--bg);

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

.app {
    width: 100%;
    max-width: 620px;
    margin: 0 auto;

    padding:
        max(22px, env(safe-area-inset-top))
        20px
        max(30px, env(safe-area-inset-bottom));
}

.header {
    position: relative;
    margin-bottom: 22px;
}

h1 {
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 48px;
    line-height: 1;

    margin: 14px 0 4px;

    letter-spacing: -1.5px;
}

.tagline {
    color: #7e746d;

    font-family: Georgia, serif;

    font-style: italic;

    font-size: 18px;
}

.decor {
    position: absolute;

    right: 4px;
    top: -2px;

    font-size: 46px;

    opacity: .72;

    transform:
        rotate(-8deg);
}

.card {
    background: var(--card);

    border:
        1px solid
        rgba(255,255,255,.75);

    border-radius: 28px;

    box-shadow:
        var(--shadow);

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);
}

.hidden {
    display: none !important;
}

#loginCard {
    padding: 22px;
}

#loginCard h2 {
    margin-top: 0;

    font-family:
        Georgia,
        serif;
}

.login-divider {
    text-align: center;

    color: var(--muted);

    font-size: 13px;

    margin: 12px 0;
}

#createAccountButton {
    width: 100%;

    min-height: 52px;

    border-radius: 16px;

    font-size: 16px;

    font-weight: 700;
}

input,
select,
button {
    font-family: inherit;
}

input,
select {
    width: 100%;

    min-height: 52px;

    border:
        1px solid
        #ded8d1;

    border-radius: 15px;

    padding: 11px 13px;

    background:
        rgba(255,255,255,.9);

    font-size: 16px;

    margin-bottom: 10px;
}

button {
    border: 0;

    cursor: pointer;

    -webkit-tap-highlight-color:
        transparent;
}

button:active {
    transform: scale(.98);
}

.primary {
    width: 100%;

    min-height: 52px;

    border-radius: 16px;

    background: #272522;

    color: white;

    font-size: 16px;

    font-weight: 700;
}

.secondary {
    background: var(--soft);

    color: var(--text);
}

.danger {
    background: #faece8;

    color: var(--danger);
}

.status {
    color: var(--muted);

    font-size: 14px;

    margin-top: 8px;
}


/* TODAY */

.today-card {
    padding: 22px 18px;

    margin-bottom: 18px;
}

.today-layout {
    display: grid;

    grid-template-columns:
        1.15fr 2fr;

    align-items: center;
}

.today-label {
    padding-right: 18px;

    border-right:
        1px solid
        #ded8d2;
}

.today-label-title {
    font-family:
        Georgia,
        serif;

    font-weight: 700;

    font-size: 29px;
}

.today-date {
    color: var(--muted);

    margin-top: 5px;
}

.counts {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 5px;

    padding-left: 14px;
}

.count {
    text-align: center;
}

.icon-circle {
    width: 54px;
    height: 54px;

    border-radius: 50%;

    margin:
        0 auto
        7px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 24px;
}

.icon-pee {
    background: var(--blue);
}

.icon-poop {
    background: var(--tan);
}

.icon-feed {
    background: var(--green);
}

.count-number {
    font-size: 26px;

    line-height: 1;

    font-weight: 800;
}

.count-label {
    color: var(--muted);

    margin-top: 4px;

    font-size: 14px;
}


/* FEED STATUS */

.feed-card {
    background:
        linear-gradient(
            135deg,
            #edf2e8,
            #f3efe9
        );

    padding: 18px 20px;

    margin-bottom: 18px;

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 0;
}

.feed-section {
    min-height: 70px;

    display: flex;

    align-items: center;

    gap: 12px;
}

.feed-section:first-child {
    border-right:
        1px solid
        rgba(117,111,105,.2);

    padding-right: 12px;
}

.feed-section:last-child {
    padding-left: 15px;
}

.feed-big-icon {
    width: 52px;
    height: 52px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.7);

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 26px;

    flex: 0 0 auto;
}

.feed-small-label {
    font-size: 14px;

    color: #5c5752;
}

.feed-time {
    font-weight: 800;

    font-size: 20px;

    margin-top: 2px;
}

.feed-sub {
    color: var(--muted);

    font-size: 13px;

    margin-top: 2px;
}


/* ACTIONS */

.actions {
    display: grid;

    grid-template-columns:
        repeat(6, 1fr);

    gap: 12px;

    margin-bottom: 20px;
}

.action-btn {
    min-height: 118px;

    border-radius: 24px;

    font-size: 16px;

    font-weight: 700;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 10px;

    box-shadow:
        0 7px 18px
        rgba(85,66,49,.05);
}

.action-btn .action-icon {
    font-size: 29px;
}

#peeButton {
    background: var(--blue);
}

#poopButton {
    background: var(--tan);
}

#feedButton {
    background: var(--green);
}

#mixedButton {
    background: var(--lavender);
}

#pumpButton {
    background: var(--pink);
}

#moreButton {
    background: var(--soft);
}

.action-normal {
    grid-column: span 2;
}

.action-wide {
    grid-column: span 3;
}

.action-full {
    grid-column: span 6;

    min-height: 64px;

    flex-direction: row;
}


/* MORE PANEL */

.more-panel {
    padding: 18px;

    margin: -6px 0 20px;
}

.more-panel button {
    width: 100%;

    min-height: 50px;

    border-radius: 14px;

    font-weight: 700;

    margin-top: 8px;
}

#importFile {
    display: none;
}


/* HISTORY */

.history-header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin:
        30px 2px
        12px;
}

.history-title {
    font-family:
        Georgia,
        serif;

    font-size: 38px;

    font-weight: 700;
}

.history-decoration {
    font-size: 23px;

    color: #80776f;
}

.day-card {
    border-radius: 25px;

    background:
        rgba(255,255,255,.66);

    box-shadow:
        var(--shadow);

    overflow: hidden;

    margin-bottom: 18px;
}

.day-header {
    padding: 16px 18px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    font-family:
        Georgia,
        serif;

    font-size: 21px;

    font-weight: 700;

    background:
        rgba(239,235,230,.72);
}

.day-count {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    font-weight: 500;

    color: var(--muted);

    font-size: 13px;
}

.event {
    margin: 12px;

    padding: 14px;

    background:
        rgba(255,255,255,.9);

    border-radius: 20px;

    display: grid;

    grid-template-columns:
        auto 1fr auto;

    gap: 13px;

    align-items: center;

    box-shadow:
        0 5px 16px
        rgba(58,45,34,.04);
}

.event-icon {
    width: 48px;
    height: 48px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 23px;
}

.event-main {
    min-width: 0;
}

.event-name {
    font-weight: 750;

    font-size: 17px;
}

.event-time {
    color: var(--muted);

    font-size: 14px;

    margin-top: 3px;
}

.event-buttons {
    display: flex;

    gap: 6px;
}

.event-buttons button {
    min-width: 72px;

    min-height: 42px;

    border-radius: 13px;

    font-size: 14px;
}

.empty-history {
    padding: 22px;

    color: var(--muted);
}


/* MODALS */

.modal {
    position: fixed;

    inset: 0;

    background:
        rgba(50,42,36,.38);

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    z-index: 100;
}

.modal-card {
    width: 100%;

    max-width: 420px;

    padding: 22px;

    background: #fbf8f4;

    border-radius: 27px;

    box-shadow:
        0 20px 60px
        rgba(51,42,34,.2);
}

.modal-card h2 {
    margin: 0 0 16px;

    font-family:
        Georgia,
        serif;

    font-size: 29px;
}

.feed-row {
    display: grid;

    grid-template-columns:
        2fr 1fr;

    gap: 8px;
}

.field-label {
    display: block;

    margin: 4px 0 6px;

    font-size: 13px;

    color: var(--muted);

    font-weight: 700;
}

.modal-card button {
    margin-top: 8px;
}


/* SMALL PHONES */

@media (max-width: 430px) {

    h1 {
        font-size: 43px;
    }

    .decor {
        font-size: 38px;
    }

    .today-label-title {
        font-size: 25px;
    }

    .count-number {
        font-size: 23px;
    }

    .action-btn {
        min-height: 105px;
    }

    .event {
        grid-template-columns:
            auto 1fr;
    }

    .event-buttons {
        grid-column:
            1 / -1;

        width: 100%;
    }

    .event-buttons button {
        width: 50%;
    }
}

</style>
</head>


<body>


<div class="app">


<div class="header">

    <h1>
        Baby Tracker
    </h1>

    <div class="tagline">
        Small moments, big days ♡
    </div>

    <div class="decor">
        ☾ ✦
    </div>

</div>


<div
    id="loginCard"
    class="card">

    <h2>
        Sign In
    </h2>

    <input
        id="email"
        type="email"
        placeholder="Email"
        autocomplete="email">

    <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password">

    <button
        id="signInButton"
        class="primary">
        Sign In
    </button>

    <div class="login-divider">
        New to Baby Tracker?
    </div>

    <button
        id="createAccountButton"
        class="secondary">
        Create Account
    </button>

    <div
        id="loginStatus"
        class="status">
    </div>

</div>


<div
    id="tracker"
    class="hidden">


    <div class="card today-card">

        <div class="today-layout">

            <div class="today-label">

                <div class="today-label-title">
                    Today
                </div>

                <div
                    id="todayDate"
                    class="today-date">
                </div>

            </div>


            <div class="counts">

                <div class="count">

                    <div class="icon-circle icon-pee">
                        💧
                    </div>

                    <div
                        id="peeCount"
                        class="count-number">
                        0
                    </div>

                    <div class="count-label">
                        Pee
                    </div>

                </div>


                <div class="count">

                    <div class="icon-circle icon-poop">
                        💩
                    </div>

                    <div
                        id="poopCount"
                        class="count-number">
                        0
                    </div>

                    <div class="count-label">
                        Poop
                    </div>

                </div>


                <div class="count">

                    <div class="icon-circle icon-feed">
                        🍼
                    </div>

                    <div
                        id="feedCount"
                        class="count-number">
                        0
                    </div>

                    <div class="count-label">
                        Feed
                    </div>

                </div>

            </div>

        </div>

    </div>


    <div class="card feed-card">

        <div class="feed-section">

            <div class="feed-big-icon">
                🍼
            </div>

            <div>

                <div class="feed-small-label">
                    Last feed
                </div>

                <div
                    id="lastFeedTime"
                    class="feed-time">
                    --
                </div>

                <div
                    id="todayFeedTotal"
                    class="feed-sub">
                    0 mL
                </div>

            </div>

        </div>


        <div class="feed-section">

            <div class="feed-big-icon">
                ◷
            </div>

            <div>

                <div class="feed-small-label">
                    Next feed
                </div>

                <div
                    id="nextFeedTime"
                    class="feed-time">
                    --
                </div>

                <div
                    id="nextFeedCountdown"
                    class="feed-sub">
                    --
                </div>

            </div>

        </div>

    </div>


    <div class="actions">

        <button
            id="peeButton"
            class="action-btn action-normal">

            <span class="action-icon">
                💧
            </span>

            Pee

        </button>


        <button
            id="poopButton"
            class="action-btn action-normal">

            <span class="action-icon">
                💩
            </span>

            Poop

        </button>


        <button
            id="feedButton"
            class="action-btn action-normal">

            <span class="action-icon">
                🍼
            </span>

            Feed

        </button>


        <button
            id="mixedButton"
            class="action-btn action-wide">

            <span class="action-icon">
                💧💩
            </span>

            Mixed

        </button>


        <button
            id="pumpButton"
            class="action-btn action-wide">

            <span class="action-icon">
                🍼
            </span>

            Pump

        </button>


        <button
            id="moreButton"
            class="action-btn action-full">

            <span class="action-icon">
                ⚙
            </span>

            More

        </button>

    </div>


    <div
        id="morePanel"
        class="card more-panel hidden">

        <div
            id="cloudStatus"
            class="status">
            Connected
        </div>

        <button
            id="importButton"
            class="secondary">
            📥 Import History
        </button>

        <input
            id="importFile"
            type="file"
            accept=".json,application/json">

        <div
            id="importStatus"
            class="status">
        </div>

        <button
            id="signOutButton"
            class="secondary">
            Sign Out
        </button>

    </div>


    <div class="history-header">

        <div class="history-title">
            History
        </div>

        <div class="history-decoration">
            ♡
        </div>

    </div>


    <div id="history"></div>


</div>

</div>



<div
    id="amountModal"
    class="modal hidden">

    <div class="modal-card">

        <h2 id="amountModalTitle">
            Log Feeding
        </h2>

        <div class="feed-row">

            <input
                id="amountInput"
                type="number"
                step="0.1"
                inputmode="decimal"
                placeholder="Amount">

            <select id="amountUnit">

                <option value="oz">
                    oz
                </option>

                <option value="ml">
                    mL
                </option>

            </select>

        </div>

        <label class="field-label">
            Date and time
        </label>

        <input
            id="amountDateTime"
            type="datetime-local">

        <button
            id="saveAmountButton"
            class="primary">
            Save
        </button>

        <button
            id="cancelAmountButton"
            class="secondary">
            Cancel
        </button>

    </div>

</div>



<div
    id="editSimpleModal"
    class="modal hidden">

    <div class="modal-card">

        <h2 id="editSimpleTitle">
            Edit
        </h2>

        <label class="field-label">
            Date and time
        </label>

        <input
            id="simpleDateTime"
            type="datetime-local">

        <button
            id="saveSimpleButton"
            class="primary">
            Save Changes
        </button>

        <button
            id="cancelSimpleButton"
            class="secondary">
            Cancel
        </button>

    </div>

</div>



<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js"

import {
    getAuth,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js"

import {
    getDatabase,
    ref,
    set,
    update,
    onValue
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js"



const firebaseConfig = {

    apiKey:
    "AIzaSyC2Bx2QOJMk8Q28LSJmBDGjyLZHztDWA20",

    authDomain:
    "lugo-baby-tracker.firebaseapp.com",

    databaseURL:
    "https://lugo-baby-tracker-default-rtdb.firebaseio.com",

    projectId:
    "lugo-baby-tracker",

    storageBucket:
    "lugo-baby-tracker.firebasestorage.app",

    messagingSenderId:
    "440667557935",

    appId:
    "1:440667557935:web:d5e096f71fa5f200d576da"

}



const app =
initializeApp(firebaseConfig)

const auth =
getAuth(app)

const db =
getDatabase(app)



const loginCard =
document.getElementById("loginCard")

const tracker =
document.getElementById("tracker")

const loginStatus =
document.getElementById("loginStatus")

const cloudStatus =
document.getElementById("cloudStatus")

const history =
document.getElementById("history")

const importFile =
document.getElementById("importFile")

const importStatus =
document.getElementById("importStatus")

const morePanel =
document.getElementById("morePanel")



const amountModal =
document.getElementById("amountModal")

const amountModalTitle =
document.getElementById("amountModalTitle")

const amountInput =
document.getElementById("amountInput")

const amountUnit =
document.getElementById("amountUnit")

const amountDateTime =
document.getElementById("amountDateTime")



const editSimpleModal =
document.getElementById("editSimpleModal")

const editSimpleTitle =
document.getElementById("editSimpleTitle")

const simpleDateTime =
document.getElementById("simpleDateTime")



let currentUid = null

let currentEvents = {}

let unsubscribeEvents = null

let editingAmountId = null

let editingAmountType = null

let editingSimpleId = null



function updateTodayDate() {

    document
    .getElementById("todayDate")
    .textContent =
    new Date()
    .toLocaleDateString(
        undefined,
        {
            weekday: "short",
            month: "short",
            day: "numeric"
        }
    )

}

updateTodayDate()



document
.getElementById("moreButton")
.addEventListener(
"click",
() => {

    const opening =
    morePanel
    .classList
    .contains("hidden")

    morePanel
    .classList
    .toggle("hidden")

    document
    .getElementById("moreButton")
    .innerHTML =
    opening
    ? '<span class="action-icon">⚙</span> Less'
    : '<span class="action-icon">⚙</span> More'

})



document
.getElementById("signInButton")
.addEventListener(
"click",
async () => {

    const email =
    document
    .getElementById("email")
    .value
    .trim()

    const password =
    document
    .getElementById("password")
    .value


    if(!email) {

        loginStatus.textContent =
        "Enter your email address."

        return

    }


    if(!password) {

        loginStatus.textContent =
        "Enter your password."

        return

    }


    loginStatus.textContent =
    "Signing in..."


    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        )


        document
        .getElementById("password")
        .value =
        ""


    } catch(error) {

        if(
            error.code ===
            "auth/invalid-credential"
        ) {

            loginStatus.textContent =
            "Incorrect email or password."

        } else if(
            error.code ===
            "auth/invalid-email"
        ) {

            loginStatus.textContent =
            "Enter a valid email address."

        } else {

            loginStatus.textContent =
            error.message

        }

    }

})



document
.getElementById("createAccountButton")
.addEventListener(
"click",
async () => {

    const email =
    document
    .getElementById("email")
    .value
    .trim()

    const password =
    document
    .getElementById("password")
    .value


    if(!email) {

        loginStatus.textContent =
        "Enter an email address first."

        return

    }


    if(password.length < 6) {

        loginStatus.textContent =
        "Password must be at least 6 characters."

        return

    }


    const confirmed =
    confirm(
        "Create a new Baby Tracker account for " +
        email +
        "?\n\n" +
        "This account will have its own separate baby history."
    )


    if(!confirmed)
        return


    loginStatus.textContent =
    "Creating account..."


    try {

        await createUserWithEmailAndPassword(
            auth,
            email,
            password
        )


        document
        .getElementById("password")
        .value =
        ""


    } catch(error) {

        if(
            error.code ===
            "auth/email-already-in-use"
        ) {

            loginStatus.textContent =
            "That email already has a Baby Tracker account. Tap Sign In instead."

        } else if(
            error.code ===
            "auth/invalid-email"
        ) {

            loginStatus.textContent =
            "Enter a valid email address."

        } else if(
            error.code ===
            "auth/weak-password"
        ) {

            loginStatus.textContent =
            "Choose a stronger password."

        } else {

            loginStatus.textContent =
            error.message

        }

    }

})



document
.getElementById("signOutButton")

() => signOut(auth)
)



onAuthStateChanged(
auth,
user => {

    if(unsubscribeEvents) {

        unsubscribeEvents()

        unsubscribeEvents = null

    }


    if(!user) {

        currentUid = null

        currentEvents = {}

        loginCard
        .classList
        .remove("hidden")

        tracker
        .classList
        .add("hidden")

        loginStatus.textContent =
        ""

        return

    }


    currentUid =
    user.uid


    loginCard
    .classList
    .add("hidden")


    tracker
    .classList
    .remove("hidden")


    cloudStatus.textContent =
    "Connected as " +
    user.email


    watchEvents()

})



function eventsRef() {

    return ref(
        db,
        "users/" +
        currentUid +
        "/events"
    )

}



function watchEvents() {

    unsubscribeEvents =
    onValue(
        eventsRef(),
        snapshot => {

            currentEvents =
            snapshot.val() || {}

            render()

        }
    )

}



function makeCloudId() {

    if(
        typeof crypto !==
        "undefined"

        &&

        crypto.randomUUID
    ) {

        return (
            "web_" +
            crypto
            .randomUUID()
            .replaceAll("-", "")
        )

    }


    return (
        "web_" +
        Date.now() +
        "_" +
        Math.floor(
            Math.random() *
            1000000
        )
    )

}



function dateToInputValue(timestamp) {

    const date =
    new Date(timestamp)


    const offset =
    date.getTimezoneOffset() *
    60000


    return new Date(
        timestamp - offset
    )
    .toISOString()
    .slice(0,16)

}



function inputValueToTimestamp(value) {

    return new Date(value)
    .getTime()

}



function dateKey(timestamp) {

    const d =
    new Date(timestamp)


    return (
        d.getFullYear() +
        "-" +
        String(
            d.getMonth()+1
        ).padStart(2,"0") +
        "-" +
        String(
            d.getDate()
        ).padStart(2,"0")
    )

}



function dateHeaderText(timestamp) {

    return new Date(timestamp)
    .toLocaleDateString(
        undefined,
        {
            weekday:"long",
            month:"long",
            day:"numeric",
            year:"numeric"
        }
    )

}



function timeOnly(timestamp) {

    return new Date(timestamp)
    .toLocaleTimeString(
        undefined,
        {
            hour:"numeric",
            minute:"2-digit"
        }
    )

}



async function addSimple(type) {

    if(!currentUid)
        return


    const cloudId =
    makeCloudId()


    const now =
    Date.now()


    await set(

        ref(
            db,
            "users/" +
            currentUid +
            "/events/" +
            cloudId
        ),

        {
            cloudId,
            type,
            timestamp: now,
            source: "web",
            deleted: false,
            updatedAt: now
        }

    )

}

document
.getElementById("saveAmountButton")
.addEventListener(
"click",
async () => {

    const amount =
    Number(
        amountInput.value
    )


    const unit =
    amountUnit.value

    : amount

                "/events/" +
                editingAmountId
            ),

            {

                amount,

                enteredUnit:
                unit,

                amountMl,

                timestamp,

                deleted:
                false,

                updatedAt:
                Date.now()
            }

        )

    } else {

        const cloudId =
        makeCloudId()


        await set(

            ref(
                db,
                "users/" +
                currentUid +
                "/events/" +
                cloudId
            ),

            {
                cloudId,

                type:
                editingAmountType,

                enteredAmount:
                amount,

                enteredUnit:
                unit,

                amountMl,

                timestamp,

                source:
                "web",

                deleted:
                false,

                updatedAt:
                Date.now()
            }

        )

    }


    editingAmountId =
    null


    editingAmountType =
    null


    amountModal
    .classList
    .add("hidden")

})

document

    importFile.value =

importFile
.addEventListener(
"change",
async event => {

    const file =
    event.target.files[0]


    if(!file)
        return


    importStatus.textContent =
    "Reading import file..."


    try {

        const text =
        await file.text()


        const data =
        JSON.parse(text)


        if(
            !data.events ||
            typeof data.events !==
            "object"
        ) {

            throw new Error(
                "This is not a valid Baby Tracker import file."
            )

        }


        const importedEvents =
        Object.entries(
            data.events
        )


        const allowedTypes =
        new Set([
            "pee",
            "poop",
            "mixed",
            "feed",
            "pump"
        ])


        let newCount =
        0


        let duplicateCount =
        0


        let invalidCount =
        0


        const updates =
        {}


        for(
            const [fileId,event]
            of importedEvents
        ) {

            if(
                !event
                ||
                !allowedTypes.has(
                    event.type
                )
                ||
                !Number.isFinite(
                    Number(
                        event.timestamp
                    )
                )
            ) {

                invalidCount++

                continue

            }


            const cloudId =
            event.cloudId ||
            fileId


            if(
                currentEvents[
                    cloudId
                ]
            ) {

                duplicateCount++

                continue

            }


            updates[
                cloudId
            ] = {

                ...event,

                cloudId,

                source:
                event.source ||
                "import",

                deleted:
                false,

                updatedAt:
                Number(
                    event.updatedAt
                ) ||
                Date.now()

            }


            newCount++

        }


        if(newCount === 0) {

            importStatus.textContent =
            "Nothing new to import. " +
            duplicateCount +
            " entries were already present."

            return

        }


        if(
            !confirm(
                "Import " +
                newCount +
                " historical entries?"
            )
        ) {

            importStatus.textContent =
            "Import cancelled."

            return

        }


        importStatus.textContent =
        "Importing " +
        newCount +
        " entries..."


        await update(
            eventsRef(),
            updates
        )


        importStatus.textContent =
        "Import complete ✓ " +
        newCount +
        " entries added"


        if(duplicateCount > 0) {

            importStatus.textContent +=
            " • " +
            duplicateCount +
            " duplicates skipped"

        }


        if(invalidCount > 0) {

            importStatus.textContent +=
            " • " +
            invalidCount +
            " unsupported entries skipped"

        }

    } catch(error) {

        importStatus.textContent =
        "Import failed: " +
        error.message

    }

})



function isToday(timestamp) {

    const d =
    new Date(timestamp)


    const today =
    new Date()


    return (
        d.getFullYear() ===
        today.getFullYear()

        &&

        d.getMonth() ===
        today.getMonth()

        &&

        d.getDate() ===
        today.getDate()
    )

}



function updateFeedingStatus() {

    const feeds =
    Object.values(
        currentEvents
    )

    .filter(
        event =>
        event &&
        !event.deleted &&
        event.type ===
        "feed"
    )

    .sort(
        (a,b) =>
        Number(
            b.timestamp
        ) -
        Number(
            a.timestamp
        )
    )


    const lastFeedTime =
    document
    .getElementById(
        "lastFeedTime"
    )


    const nextFeedTime =
    document
    .getElementById(
        "nextFeedTime"
    )


    const countdown =
    document
    .getElementById(
        "nextFeedCountdown"
    )


    if(
        feeds.length === 0
    ) {

        lastFeedTime.textContent =
        "--"


        nextFeedTime.textContent =
        "--"


        countdown.textContent =
        "--"


        return

    }


    const latest =
    Number(
        feeds[0].timestamp
    )


    const next =
    latest +
    (
        3 *
        60 *
        60 *
        1000
    )


    const remaining =
    next -
    Date.now()


    lastFeedTime.textContent =
    timeOnly(latest)


    nextFeedTime.textContent =
    timeOnly(next)


    if(remaining <= 0) {

        countdown.textContent =
        "Due now"

    } else {

        const mins =
        Math.floor(
            remaining /
            60000
        )


        const h =
        Math.floor(
            mins /
            60
        )


        const m =
        mins % 60


        countdown.textContent =
        h > 0
        ? "in " +
          h +
          " hr " +
          m +
          " min"
        : "in " +
          m +
          " min"

    }

}



function eventIconClass(type) {

    if(type === "pee")
        return "icon-pee"


    if(type === "poop")
        return "icon-poop"


    if(type === "mixed")
        return "icon-pee"


    if(type === "feed")
        return "icon-feed"


    if(type === "pump")
        return "icon-feed"


    return ""

}



function eventIcon(type) {

    if(type === "pee")
        return "💧"


    if(type === "poop")
        return "💩"


    if(type === "mixed")
        return "💧💩"


    if(type === "feed")
        return "🍼"


    if(type === "pump")
        return "🍼"


    return "•"

}



function eventName(event) {

    let name =
    "Entry"


    if(event.type === "pee")
        name = "Pee"


    if(event.type === "poop")
        name = "Poop"


    if(event.type === "mixed")
        name = "Mixed"


    if(event.type === "feed")
        name = "Feed"


    if(event.type === "pump")
        name = "Pump"


    if(
        (
            event.type === "feed"
            ||
            event.type === "pump"
        )

        &&

        event.enteredAmount != null
    ) {

        name +=
        " • " +
        event.enteredAmount +
        " " +
        (
            event.enteredUnit ||
            "mL"
        )

    }


    return name

}



function render() {

    const entries =
    Object.entries(
        currentEvents
    )

    .filter(
        ([id,event]) =>
        event &&
        !event.deleted
    )

    .sort(
        (a,b) =>
        Number(
            b[1].timestamp
        ) -
        Number(
            a[1].timestamp
        )
    )


    let pee =
    0


    let poop =
    0


    let feed =
    0


    let totalMl =
    0


    for(
        const [id,event]
        of entries
    ) {

        if(
            !isToday(
                event.timestamp
            )
        )
            continue


        if(event.type === "pee")
            pee++


        if(event.type === "poop")
            poop++


        if(event.type === "mixed") {

            pee++

            poop++

        }


        if(event.type === "feed") {

            feed++

            totalMl +=
            Number(
                event.amountMl ||
                0
            )

        }

    }


    document
    .getElementById(
        "peeCount"
    )
    .textContent =
    pee


    document
    .getElementById(
        "poopCount"
    )
    .textContent =
    poop


    document
    .getElementById(
        "feedCount"
    )
    .textContent =
    feed


    document
    .getElementById(
        "todayFeedTotal"
    )
    .textContent =
    totalMl.toFixed(0) +
    " mL / " +
    (
        totalMl /
        29.5735
    ).toFixed(1) +
    " oz"


    updateFeedingStatus()


    history.innerHTML =
    ""


    if(entries.length === 0) {

        const empty =
        document.createElement(
            "div"
        )


        empty.className =
        "card empty-history"


        empty.textContent =
        "No entries yet."


        history.appendChild(
            empty
        )


        return

    }


    const days =
    {}


    for(
        const item
        of entries
    ) {

        const day =
        dateKey(
            item[1].timestamp
        )


        if(!days[day])
            days[day] = []


        days[day].push(item)

    }


    for(
        const day
        of Object.keys(days)
    ) {

        const dayItems =
        days[day]


        const dayCard =
        document.createElement(
            "div"
        )


        dayCard.className =
        "day-card"


        const header =
        document.createElement(
            "div"
        )


        header.className =
        "day-header"


        const headerDate =
        document.createElement(
            "span"
        )


        headerDate.textContent =
        dateHeaderText(
            dayItems[0][1]
            .timestamp
        )


        const count =
        document.createElement(
            "span"
        )


        count.className =
        "day-count"


        count.textContent =
        dayItems.length +
        (
            dayItems.length === 1
            ? " entry"
            : " entries"
        )


        header.appendChild(
            headerDate
        )


        header.appendChild(
            count
        )


        dayCard.appendChild(
            header
        )


        for(
            const [
                cloudId,
                event
            ]
            of dayItems
        ) {

            const card =
            document.createElement(
                "div"
            )


            card.className =
            "event"


            const icon =
            document.createElement(
                "div"
            )


            icon.className =
            "event-icon " +
            eventIconClass(
                event.type
            )


            icon.textContent =
            eventIcon(
                event.type
            )


            const main =
            document.createElement(
                "div"
            )


            main.className =
            "event-main"


            const title =
            document.createElement(
                "div"
            )


            title.className =
            "event-name"


            title.textContent =
            eventName(event)


            const time =
            document.createElement(
                "div"
            )


            time.className =
            "event-time"


            time.textContent =
            timeOnly(
                event.timestamp
            )


            main.appendChild(
                title
            )


            main.appendChild(
                time
            )


            const buttons =
            document.createElement(
                "div"
            )


            buttons.className =
            "event-buttons"


            const edit =
            document.createElement(
                "button"
            )


            edit.className =
            "secondary"


            edit.textContent =
            "Edit"


            edit.onclick =
            () => {

                if(
                    event.type ===
                    "feed"

                    ||

                    event.type ===
                    "pump"
                ) {

                    openAmountEdit(
                        cloudId
                    )

                } else {

                    openSimpleEdit(
                        cloudId
                    )

                }

            }


            const remove =
            document.createElement(
                "button"
            )


            remove.className =
            "danger"


            remove.textContent =
            "Delete"


            remove.onclick =
            () =>
            deleteEvent(
                cloudId
            )


            buttons.appendChild(
                edit
            )


            buttons.appendChild(
                remove
            )


            card.appendChild(
                icon
            )


            card.appendChild(
                main
            )


            card.appendChild(
                buttons
            )


            dayCard.appendChild(
                card
            )

        }


        history.appendChild(
            dayCard
        )

    }

}



setInterval(
() => {

    if(currentUid)
        updateFeedingStatus()

},
60000
)
